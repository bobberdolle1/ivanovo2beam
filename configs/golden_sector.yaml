# ivanovo2beam — Golden Sector benchmark: Kokhma SE / Р152 Uvod Crossing.
#
# A 4.095 x 4.095 km high-resolution (1.0 m terrain grid) vertical slice of the
# Ivanovo -> Shuya highway (Р152 / 24К-260) around the Uvod river crossing:
#
#   * primary highway approaches, curves, and intersections
#   * 60.8 m primary bridge (way/274102985) + secondary bridge (way/274102983)
#   * Uvod river and surrounding ponds / waterbodies
#   * Central Russian summer forests, clearings, and open meadows
#
# Preserves the Ivanovo Oblast 1:1 Transverse Mercator origin so every
# coordinate matches the full corridor 1:1.

region:
  id: ivanovo_oblast
  title: Ivanovo Oblast
  bbox:
    west: 39.00
    south: 56.10
    east: 43.20
    north: 57.80
  projection:
    central_meridian: 41.10
    latitude_of_origin: 57.00
    origin: [40.97393, 56.99987]

terrain:
  source: copernicus_glo30
  resolution_m: 30

sectors:
  size_m: 1000

roads:
  simplify_tolerance_m: 0.5
  junction_snap_m: 0.5
  corridor_half_width_m: 12.0
  max_grade: 0.08

level:
  id: ivanovo_golden_sector
  title: "Ivanovo 1:1 - Golden Sector (Kokhma SE / Р152 Uvod Crossing)"
  center: [41.12500, 56.91500]
  spawn: [41.10000, 56.92700]
  terrain:
    grid_size: 4096
    square_size_m: 1.0
  ground_margin_m: 8.0
  time_of_day: 0.5
  axis_tilt: 23.44

buildings:
  enabled: false

vegetation:
  enabled: true

water:
  enabled: true

railways:
  enabled: true

bridges:
  enabled: true

satellite:
  enabled: false

cache:
  dir: .cache

build:
  dir: build
