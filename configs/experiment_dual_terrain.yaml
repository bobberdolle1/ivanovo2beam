# ivanovo2beam — P2 Multi-TerrainBlock Experiment: Kokhma SE / Р152 Seam Test.
#
# Places two adjacent 2048x2048 @ 1.0 m TerrainBlocks side-by-side along X:
#   - West block (theTerrain_0_0): x in [6303.0, 8350.0], y in [-9800.0, -7753.0]
#   - East block (theTerrain_1_0): x in [8350.0, 10397.0], y in [-9800.0, -7753.0]
#   - Shared seam at x = 8350.0 (2048 identical border vertices, 2047.0 m span)
#
# The seam at x = 8350.0 cuts directly across:
#   * Р152 primary highway (way/183586213) for 80-100 km/h drive-across testing
#   * Uvod river (way/136383439) and tributary (way/274670197)
#   * Kokhma SE residential street grid & buildings
#   * Continuous summer forest polygon (-10290996000001) & GroundCover
#   * Uvod bridge (way/274102985) lies ~380 m west of the seam on the West block.

region:
  id: ivanovo_oblast
  title: Ivanovo Oblast
  bbox:
    west: 39.00
    south: 56.10
    east: 43.20
    north: 57.80
  projection:
    central_meridian: 41.10
    latitude_of_origin: 57.00
    origin: [40.97393, 56.99987]

terrain:
  source: copernicus_glo30
  resolution_m: 30

sectors:
  size_m: 1000

roads:
  simplify_tolerance_m: 0.5
  junction_snap_m: 0.5
  corridor_half_width_m: 12.0
  max_grade: 0.08

level:
  id: ivanovo_dual_terrain_exp
  title: "Ivanovo 1:1 - P2 Dual-TerrainBlock Experiment (Kokhma SE / Р152)"
  center: [41.111318, 56.921112]
  spawn: [41.107542, 56.924808]
  terrain:
    grid_size: 2048
    square_size_m: 1.0
  ground_margin_m: 8.0
  time_of_day: 0.5
  axis_tilt: 23.44

multiblock:
  tile_grid_size: 2048
  square_size_m: 1.0
  cols: 2
  rows: 1
  origin_world: [6303.0, -9800.0]
  base_tex_size: 512
  road_seam_mode: continuous
  groundcover_enabled: true
  max_buildings: 400
  extra_spawns:
    - key: spawn_bridge_approach
      name: spawn_bridge_approach
      title: "P152 West of Uvod Bridge (Bridge + Seam Run)"
      geo: [41.101958, 56.925751]

buildings:
  enabled: true

vegetation:
  enabled: true

water:
  enabled: true

railways:
  enabled: true

bridges:
  enabled: true

satellite:
  enabled: false

cache:
  dir: .cache

build:
  dir: build
