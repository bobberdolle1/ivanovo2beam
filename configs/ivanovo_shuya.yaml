# ivanovo2beam — milestone M4: the Ivanovo -> Shuya intercity corridor.
#
# This is the project's end-to-end benchmark. It is the first level large enough
# to test the things a city sector cannot:
#
#   * real intercity distance — 29.14 km straight line, ~33 km by road
#   * sustained floating-point precision far from the world origin (up to 24 km)
#   * a long unbroken drive on a single road, including river crossings
#   * villages appearing where villages actually are
#   * build and load behaviour at a grid size 4x the MVP
#
# The level is a square, because a BeamNG TerrainBlock must be square, centred on
# the midpoint of the two cities so that both fit inside it. 8192 vertices at
# 4.0 m spacing spans 32.76 km, which leaves roughly 4.5 km of margin beyond
# Shuya and the same beyond Ivanovo.
#
# The spawn point is anchored on Ivanovo, not on the level centre. The centre is
# farmland halfway between the two cities; the whole point of the level is to
# start in Ivanovo and drive to Shuya.

region:
  id: ivanovo_oblast
  title: Ivanovo Oblast
  bbox:
    west: 39.00
    south: 56.10
    east: 43.20
    north: 57.80
  projection:
    central_meridian: 41.10
    latitude_of_origin: 57.00
    # World origin stays at Ivanovo city centre, so the entire corridor lies
    # within ~24 km of it and float32 precision stays in the millimetre range.
    origin: [40.97393, 56.99987]

terrain:
  source: copernicus_glo30
  resolution_m: 30

sectors:
  # 4 km sectors: at corridor scale this keeps the sector count in the hundreds
  # rather than the tens of thousands.
  size_m: 4000

roads:
  # Roads here are mostly rural: two-lane asphalt between settlements, gravel
  # and dirt tracks in between. Keep the graded corridor tight so it does not
  # erase the verges and drainage ditches that define a Russian intercity road.
  simplify_tolerance_m: 0.75
  junction_snap_m: 0.5
  corridor_half_width_m: 14.0
  max_grade: 0.12

level:
  id: ivanovo_shuya
  title: "Ivanovo 1:1 - Ivanovo to Shuya"
  # Midpoint of Ivanovo (40.97393, 56.99987) and Shuya (41.36444, 56.84861).
  center: [41.16958, 56.92439]
  # Spawn in Ivanovo, at the region's world origin.
  spawn: [40.97393, 56.99987]
  terrain:
    # 8191 * 4.0 = 32764 m. A power-of-two grid is required by the engine; 8192
    # is its maximum, and 4.0 m spacing is the finest that still covers the
    # 29 km route in a single terrain block.
    grid_size: 8192
    square_size_m: 4.0
  ground_margin_m: 8.0

buildings:
  enabled: true

vegetation:
  enabled: false

cache:
  dir: .cache

build:
  dir: build
