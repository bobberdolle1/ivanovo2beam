# ivanovo2beam — P1 Hybrid Terrain Experiment: 1 Base TerrainBlock + 1 m RTIN Corridor Meshes.
#
# Covers the exact same 16.38 x 16.38 km Ivanovo-Kokhma-Shuya P152 territory as
# P0 (ivanovo_single_8192_2m) for apples-to-apples comparison:
#   * Base TerrainBlock: 4096x4096 @ 4.0 m = 16.380 x 16.380 km (~48 MiB .ter),
#     depressed -0.55 m strictly beneath main highway corridor footprints so tires
#     and raycasts never double-collide or poke through.
#   * High-detail static Collada (.dae) ground/corridor meshes: 512 m chunks at
#     1.0 m resolution, RTIN-simplified within 0.08 m tolerance along P152 +
#     major connecting corridors, smoothly feathered underground at outer edges.
#   * DecalRoads over corridor meshes use overObjects: true with stratified
#     decalBias and native BeamNG PBR ground materials.

region:
  id: ivanovo_oblast
  title: Ivanovo Oblast
  bbox:
    west: 39.00
    south: 56.10
    east: 43.20
    north: 57.80
  projection:
    central_meridian: 41.10
    latitude_of_origin: 57.00
    origin: [40.97393, 56.99987]

terrain:
  source: copernicus_glo30
  resolution_m: 30

sectors:
  size_m: 1000

roads:
  simplify_tolerance_m: 0.5
  junction_snap_m: 0.5
  corridor_half_width_m: 12.0
  max_grade: 0.08

level:
  id: ivanovo_hybrid_corridor
  title: "Ivanovo 1:1 - P1 Hybrid Terrain Experiment (Base 4m + 1m RTIN Corridors)"
  center: [41.16958, 56.92439]
  spawn: [41.10000, 56.92700]
  terrain:
    grid_size: 4096
    square_size_m: 4.0
  ground_margin_m: 8.0
  time_of_day: 0.5
  axis_tilt: 23.44

hybrid:
  corridor_cell_size_m: 1.0
  tile_squares: 512
  rtin_max_error_m: 0.08
  corridor_highways:
    - motorway
    - motorway_link
    - trunk
    - trunk_link
    - primary
    - primary_link
    - secondary
    - secondary_link
  depress_depth_m: 0.55
  depress_inner_extra_m: 6.0
  depress_outer_extra_m: 12.0
  feather_width_m: 4.0
  feather_depth_m: 0.55
  base_tex_size: 512
  groundcover_enabled: true
  max_buildings: 6000
  max_trees: 45000
  extra_spawns:
    - key: spawn_kokhma_se
      name: spawn_kokhma_se
      title: "P152 Kokhma SE / Uvod Bridge"
      geo: [41.101958, 56.925751]
    - key: spawn_ivanovo_exit
      name: spawn_ivanovo_exit
      title: "P152 Ivanovo Exit (Кохомское шоссе)"
      geo: [41.0520, 56.9480]

buildings:
  enabled: true

vegetation:
  enabled: true

water:
  enabled: true

railways:
  enabled: true

bridges:
  enabled: true

satellite:
  enabled: false

cache:
  dir: .cache

build:
  dir: build
