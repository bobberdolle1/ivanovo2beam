# ivanovo2beam — showcase level: Plyos on the Volga River.
#
# "Ivanovo 1:1 - Plyos on the Volga"
# Located on the steep right bank of the Volga River (~850 m wide) in the northern
# part of Ivanovo Oblast. Characterized by dramatic 70 m forested bluffs,
# Sobornaya Gora (Cathedral Hill), Mount Levitan (Petropavlovskaya Gora),
# tight switchbacks, the historical merchant embankment, and dense
# wooden vernacular architecture.
#
# 4096 vertices at 1.25 m spacing covers (4096 - 1) * 1.25 = 5118.75 m (~5.12 km).

region:
  id: ivanovo_oblast
  title: Ivanovo Oblast
  bbox:
    west: 39.00
    south: 56.10
    east: 43.20
    north: 57.80
  projection:
    central_meridian: 41.10
    latitude_of_origin: 57.00
    origin: [40.97393, 56.99987]

terrain:
  source: copernicus_glo30
  resolution_m: 30

sectors:
  size_m: 1000

roads:
  simplify_tolerance_m: 0.5
  junction_snap_m: 0.5
  corridor_half_width_m: 8.0
  max_grade: 0.16

level:
  id: plyos_volga
  title: "Ivanovo 1:1 - Plyos on the Volga"
  # Historic center of Plyos
  center: [41.5136, 57.4586]
  # Spawn at scenic embankment overlook
  spawn: [41.5136, 57.4555]
  terrain:
    grid_size: 4096
    square_size_m: 1.25
  ground_margin_m: 10.0

# Feature flags
buildings:
  enabled: true

vegetation:
  enabled: true

water:
  enabled: true

railways:
  enabled: true

bridges:
  enabled: true

satellite:
  enabled: false

cache:
  dir: .cache

build:
  dir: build
