# ivanovo2beam — P0 Single-Terrain 8192x8192 @ 2.0 m Benchmark.
#
# Full 16.382 x 16.382 km Ivanovo-Kokhma-Shuya P152 corridor slice on a single
# maximum-size BeamNG TerrainBlock (8192x8192 vertices at 2.0 m spacing):
#
#   * Center at the Ivanovo-Shuya P152 midpoint [41.16958, 56.92439]
#   * Spawn on P152 near Kokhma / Uvod river crossing [41.10000, 56.92700]
#   * Same Ivanovo Oblast 1:1 Transverse Mercator origin as golden_sector.yaml
#   * All Golden Sector V2 features enabled (buildings, vegetation, water,
#     railways, bridges, roadside props, GroundCover)

region:
  id: ivanovo_oblast
  title: Ivanovo Oblast
  bbox:
    west: 39.00
    south: 56.10
    east: 43.20
    north: 57.80
  projection:
    central_meridian: 41.10
    latitude_of_origin: 57.00
    origin: [40.97393, 56.99987]

terrain:
  source: copernicus_glo30
  resolution_m: 30

sectors:
  size_m: 1000

roads:
  simplify_tolerance_m: 0.5
  junction_snap_m: 0.5
  corridor_half_width_m: 12.0
  max_grade: 0.08

level:
  id: ivanovo_single_8192_2m
  title: "Ivanovo 1:1 - Single Terrain 8192x8192 @ 2.0m (P0 Corridor)"
  center: [41.16958, 56.92439]
  spawn: [41.10000, 56.92700]
  terrain:
    grid_size: 8192
    square_size_m: 2.0
  ground_margin_m: 8.0
  time_of_day: 0.5
  axis_tilt: 23.44

buildings:
  enabled: true

vegetation:
  enabled: true

water:
  enabled: true

railways:
  enabled: true

bridges:
  enabled: true

satellite:
  enabled: false

cache:
  dir: .cache

build:
  dir: build
