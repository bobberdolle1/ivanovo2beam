[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ivanovo2beam"
version = "0.1.0"
description = "Reproducible GIS -> BeamNG.drive pipeline that generates a 1:1-scale drivable map of Ivanovo Oblast from open geodata"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "ivanovo2beam contributors" }]
keywords = ["beamng", "gis", "openstreetmap", "dem", "map-generator", "ivanovo"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Games/Entertainment",
  "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
  "numpy>=1.26",
  "pyproj>=3.6",
  "shapely>=2.0",
  "PyYAML>=6.0",
  "Pillow>=10.0",
]

[project.optional-dependencies]
# Reading GeoTIFF DEMs. Optional so the core pipeline can run on PNG-only sources.
raster = ["rasterio>=1.3"]
# Terrain smoothing / road grade limiting.
smooth = ["scipy>=1.11"]
# Efficient .osm.pbf streaming for region-scale extracts.
pbf = ["osmium>=3.6"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]
all = [
  "ivanovo2beam[raster,smooth,pbf,dev]",
]

[project.scripts]
ivanovo2beam = "ivanovo2beam.cli:main"

[project.urls]
Homepage = "https://github.com/bobberdolle1/ivanovo2beam"
Issues = "https://github.com/bobberdolle1/ivanovo2beam/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ivanovo2beam = ["py.typed", "beamng/templates/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -p no:cacheprovider: the Windows sandbox denies the delete-child access that
# pytest's atomic cache rename needs, which otherwise emits warnings on every run.
addopts = "-q --strict-markers -p no:cacheprovider"
# Lets the suite run from a bare checkout without an editable install.
pythonpath = ["src"]
markers = [
  "network: test requires internet access (deselect with '-m \"not network\"')",
  "slow: long-running test",
  "beamng: test requires a BeamNG.drive installation",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]
